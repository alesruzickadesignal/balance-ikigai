name: Náhled (GitHub Pages + review overlay)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sestavit _site s review overlayem
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_reference-webflow' \
            --exclude='review/worker' --exclude='_site' ./ _site/
          for f in _site/*.html; do
            sed -i 's#</body>#<script src="review/review.js" defer></script></body>#' "$f"
            sed -i 's#<head>#<head><meta name="robots" content="noindex">#' "$f"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
