# Produkce (Netlify) publikuje kořen repa. Komentovací mód (review/) je jen pro náhled na GitHub Pages,
# na produkci ho nic neodkazuje a tady ho navíc schováváme.
[build]
  publish = "."

[[redirects]]
  from = "/review/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
